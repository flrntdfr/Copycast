# Every dependency in this repository is pinned exactly (pyproject.toml ==, package.json exact,
# Docker images by tag@digest, GitHub Actions by commit SHA, nixpkgs by flake.lock). Dependabot is
# the only thing that moves them: it opens a PR whenever a newer release exists, and CI decides.
# yt-dlp is excluded on purpose: engine-bump.yml re-pins it every six hours and the image tag
# :<app>-yt<engine> records which build shipped which engine.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: yt-dlp
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "python"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: daily
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies", "web"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker-compose
    directories: ["/", "/deploy/compose"]
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]
