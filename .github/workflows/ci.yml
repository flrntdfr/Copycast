name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  UV_PYTHON_DOWNLOADS: "automatic"

jobs:
  python:
    name: Python (lint, types, unit + integration tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      COPYCAST_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lockfile is current
        run: uv lock --check

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pyright
        run: uv run pyright src

      - name: Import contracts
        run: uv run lint-imports

      - name: Tests (unit + integration, coverage gate)
        run: uv run pytest -m "not e2e and not network" --cov --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: ignore

  web:
    name: Web (lint, types, tests, build, OpenAPI drift)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --locked --all-groups
          pnpm --dir web install --frozen-lockfile

      - name: Lint
        run: pnpm --dir web run lint

      - name: Typecheck
        run: pnpm --dir web run typecheck

      - name: Unit tests
        run: pnpm --dir web run test -- --run

      - name: Build
        run: pnpm --dir web run build

      - name: OpenAPI document is committed
        run: make openapi-check

  image:
    name: Image (build + smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versions
        id: versions
        run: |
          echo "app=$(grep -E '^version = ' pyproject.toml | head -n1 | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"
          echo "engine=$(python3 scripts/engine_version.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: copycast:ci
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.app }}
            ENGINE_VERSION=${{ steps.versions.outputs.engine }}
          cache-from: type=gha,scope=ci-linux/amd64
          cache-to: type=gha,mode=max,scope=ci-linux/amd64

      - name: Smoke test
        env:
          SMOKE_APP_VERSION: ${{ steps.versions.outputs.app }}
          SMOKE_ENGINE_VERSION: ${{ steps.versions.outputs.engine }}
        run: scripts/smoke.sh copycast:ci

  e2e:
    name: End to end (compose stack, httpx + Playwright)
    runs-on: ubuntu-24.04
    needs: [python, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Versions
        id: versions
        run: |
          echo "app=$(grep -E '^version = ' pyproject.toml | head -n1 | sed -E 's/version = "(.*)"/\1/')" >> "$GITHUB_OUTPUT"
          echo "engine=$(python3 scripts/engine_version.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: copycast:ci
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.app }}
            ENGINE_VERSION=${{ steps.versions.outputs.engine }}
          cache-from: type=gha,scope=ci-linux/amd64
          cache-to: type=gha,mode=max,scope=ci-linux/amd64

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          uv sync --locked --all-groups
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium

      - name: Start the stack
        run: |
          mkdir -p data && sudo chown -R 1000:1000 data
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile direct up -d --wait

      - name: Wait for readiness
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz/ready && exit 0
            sleep 3
          done
          echo "stack did not become ready" >&2
          docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile direct ps
          exit 1

      - name: E2E smoke (httpx)
        run: uv run pytest -m e2e tests/e2e -q

      - name: Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: pnpm --dir web run e2e

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile direct logs --no-color --tail 300

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile direct down -v

  k8s:
    name: Kubernetes manifests (kustomize + kubeconform)
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate base and example overlay
        run: |
          for dir in deploy/kubernetes/base deploy/kubernetes/overlays/example; do
            echo "== $dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -ignore-missing-schemas
          done
