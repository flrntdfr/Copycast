# Alembic configuration for `uv run alembic ...` from a shell.
# The application itself uses copycast.adapters.db.migrate (no ini file needed);
# the migration scripts live inside the package so they ship in the wheel.

[alembic]
script_location = copycast:adapters/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
timezone = UTC
truncate_slug_length = 40
version_path_separator = os
# Left empty on purpose: env.py falls back to the Copycast settings
# (COPYCAST__DATABASE_URL / config/copycast.toml) when this is blank.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = uv
ruff_fix.options = run ruff check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
