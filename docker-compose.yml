# Copycast compose stack.
#
# Two ways to expose the app, chosen with COMPOSE_PROFILES (see .env.example):
#   tailscale  the api shares the network namespace of a Tailscale sidecar and is reachable
#              only inside your tailnet as https://copycast.<tailnet>.ts.net
#   direct     the api publishes port 8080 on this host (only for a trusted network)
# The worker and Postgres run under both profiles.
#
# Before the first start:  mkdir -p data config && chown -R 1000:1000 data

x-env: &env
  COPYCAST__BASE_URL: ${COPYCAST_BASE_URL:-http://localhost:8080}
  COPYCAST__DATABASE_URL: postgresql://copycast:${POSTGRES_PASSWORD:-copycast}@postgres:5432/copycast
  # Empty means no authentication (docs/adr/0011).
  COPYCAST__AUTH__PASSWORD: ${COPYCAST_AUTH_PASSWORD:-}
  COPYCAST__AUTH__USERNAME: ${COPYCAST_AUTH_USERNAME:-copycast}

x-app: &app
  image: ${COPYCAST_IMAGE:-ghcr.io/flrntdfr/copycast:latest}
  user: "${COPYCAST_UID:-1000}:${COPYCAST_GID:-1000}"
  environment: *env
  volumes:
    - ./data:/data
    - ./config:/config:ro
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  tailscale:
    image: tailscale/tailscale:v1.102.3@sha256:8c42c4574ab066384fcb72f69e086a2ff1dd3652eb6f56856cee34bcf0d2f680
    profiles: [tailscale]
    hostname: copycast
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    restart: unless-stopped

  api:
    <<: *app
    profiles: [tailscale]
    command: [api]
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api-direct:
    <<: *app
    profiles: [direct]
    command: [api]
    ports:
      - "${COPYCAST_PORT:-8080}:8080"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: [worker]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8081/healthz/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_USER: copycast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copycast}
      POSTGRES_DB: copycast
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copycast -d copycast"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  tailscale-state:
