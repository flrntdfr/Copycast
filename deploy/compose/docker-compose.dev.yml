# Development Postgres only, for `make db-up` / `make db-down`.
# Matches the default database_url in config/copycast.toml:
#   postgresql+psycopg://copycast:copycast@localhost:5432/copycast
services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_USER: copycast
      POSTGRES_PASSWORD: copycast
      POSTGRES_DB: copycast
    ports:
      - "${COPYCAST_DEV_PG_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copycast -d copycast"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata-dev:
