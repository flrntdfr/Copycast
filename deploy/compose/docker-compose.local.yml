# Local stack for following work in progress: Postgres, SeaweedFS (the Object store), Valkey
# (the Feed cache), migrate, api and worker in containers, state in named Docker volumes, the
# source tree bind-mounted so both processes restart on edits.
# The Vite dev server runs on the host (scripts/local.sh) and proxies to the api on :8080.
#
#   scripts/local.sh                                       start everything (Ctrl-C stops)
#   docker compose -f deploy/compose/docker-compose.local.yml down      stop, keep the data
#   docker compose -f deploy/compose/docker-compose.local.yml down -v   stop and wipe the data
#
# The image carries the dependencies: rebuild (`up --build`, which local.sh does) after a
# change to pyproject.toml or uv.lock.
#
# A stack started before the Object store kept its files in the volume "data"; it is mounted
# read-only at /legacy. Copy it once into the Object store (the api and worker refuse a bucket
# holding feeds without LAYOUT_VERSION until then):
#   docker compose -f deploy/compose/docker-compose.local.yml run --rm --no-deps worker \
#     copycast storage push --from /legacy
name: copycast-local

x-app: &app
  image: copycast:local
  pull_policy: never
  environment:
    COPYCAST_CONFIG: /config/copycast.toml
    COPYCAST_LOG_FORMAT: console
    COPYCAST_AUTO_MIGRATE: "false"
    COPYCAST__DATABASE_URL: postgresql+psycopg://copycast:copycast@postgres:5432/copycast
    COPYCAST__BASE_URL: http://localhost:8080
    COPYCAST__STORAGE__URL: s3://copycast
    COPYCAST__STORAGE__ENDPOINT: http://seaweedfs:8333
    COPYCAST__STORAGE__ACCESS_KEY_ID: copycast
    COPYCAST__STORAGE__SECRET_ACCESS_KEY: copycast
    COPYCAST__STORAGE__SCRATCH_DIR: /scratch
    COPYCAST__CACHE__URL: redis://valkey:6379/0
    # The mounted source wins over the copy installed in the image.
    PYTHONPATH: /app/src
    # Bind mounts from macOS do not always deliver inotify events.
    WATCHFILES_FORCE_POLLING: "true"
  volumes:
    - ../../src:/app/src:ro
    - ../../config/copycast.toml:/config/copycast.toml:ro
    - scratch:/scratch
    - data:/legacy:ro
  working_dir: /app/src
  entrypoint: ["tini", "--"]
  depends_on:
    migrate:
      condition: service_completed_successfully
    seaweedfs:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.11@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    environment:
      POSTGRES_USER: copycast
      POSTGRES_PASSWORD: copycast
      POSTGRES_DB: copycast
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copycast -d copycast"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    build:
      context: ../..
      dockerfile: Dockerfile
    pull_policy: build
    command: ["copycast", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ["/bin/sh", "/copycast/entrypoint.sh"]
    environment:
      COPYCAST_S3_ACCESS_KEY: copycast
      COPYCAST_S3_SECRET_KEY: copycast
    volumes:
      - ./seaweedfs/entrypoint.sh:/copycast/entrypoint.sh:ro
      - objects:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 3s
      timeout: 3s
      retries: 60

  valkey:
    image: valkey/valkey:9.0.7-alpine@sha256:2d04268dfa26ab31cfa3fdc538866e76438b2d00e41db41b8cb86d780ac5a416
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    command: ["copycast", "api", "--reload"]
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  worker:
    <<: *app
    command: ["watchfiles", "--filter", "python", "copycast worker", "/app/src"]
    restart: unless-stopped

volumes:
  pgdata:
  data:
  objects:
  scratch:
