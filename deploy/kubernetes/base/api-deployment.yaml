apiVersion: apps/v1
kind: Deployment
metadata:
  name: copycast-api
  labels:
    app.kubernetes.io/name: copycast
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: copycast
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: copycast
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: ghcr.io/flrntdfr/copycast
          args: ["api"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: COPYCAST_AUTO_MIGRATE
              value: "true"
            - name: COPYCAST__DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: copycast-db-app
                  key: uri
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: copycast-data
        - name: config
          configMap:
            name: copycast-config
