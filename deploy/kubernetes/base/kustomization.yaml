apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Copycast on Kubernetes: an api Deployment (stateless, scales out), one worker Deployment
# (Recreate; exactly one runs), Valkey for the shared Feed cache, a CloudNativePG cluster and
# a Tailscale Ingress. Requires the CloudNativePG operator, the Tailscale Kubernetes operator
# and an S3 bucket (SeaweedFS, AWS, ...): set [storage] in copycast.toml and create the
# Secret "copycast-storage" with the keys access_key_id and secret_access_key:
#   kubectl -n copycast create secret generic copycast-storage \
#     --from-literal=access_key_id=... --from-literal=secret_access_key=...

namespace: copycast

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - valkey.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: copycast-config
    files:
      - copycast.toml

images:
  - name: ghcr.io/flrntdfr/copycast
    newTag: "2.0.0"
