apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Copycast on Kubernetes: one api Deployment, one worker Deployment (Recreate, pinned to the
# api's node so a ReadWriteOnce data volume works), a CloudNativePG cluster and a Tailscale
# Ingress. Requires the CloudNativePG operator and the Tailscale Kubernetes operator.
# HA is active-passive by definition: exactly one worker, one data volume.

namespace: copycast

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - data-pvc.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: copycast-config
    files:
      - copycast.toml

images:
  - name: ghcr.io/flrntdfr/copycast
    newTag: "1.1.2"
