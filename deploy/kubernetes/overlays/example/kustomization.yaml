apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Example overlay: copy this directory, then change base_url and [storage] in copycast.toml,
# the resource sizes and the image tag to taste.
#   kubectl apply -k deploy/kubernetes/overlays/example

resources:
  - ../../base

namespace: copycast

configMapGenerator:
  - name: copycast-config
    behavior: replace
    files:
      - copycast.toml

images:
  - name: ghcr.io/flrntdfr/copycast
    # Immutable tag: app version + engine version. `1.4.0` alone moves on every engine bump.
    newTag: "1.4.0-yt2026.8.19"

patches:
  - path: worker-resources.yaml
  - path: api-auth.yaml
