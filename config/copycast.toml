# Copycast configuration. Every key can be overridden with an environment
# variable named COPYCAST__<SECTION>__<KEY> (double underscores), for example
# COPYCAST__BASE_URL or COPYCAST__REFRESH__INTERVAL_HOURS. A missing file is
# tolerated: the defaults below are also the built-in defaults.

base_url     = "http://localhost:8080"
database_url = "postgresql+psycopg://copycast:copycast@localhost:5432/copycast"   # postgresql:// is rewritten

[refresh]
interval_hours         = 24
fetch_cooldown_minutes = 15
concurrency            = 2

[engine]
channel = "nightly"          # informational: nightly | stable

[engine.options]             # raw yt-dlp defaults; ENGINE_OWNED_OPTIONS rejected at startup

[storage]                    # the Object store: every byte Copycast keeps (docs/adr/0016)
url               = "s3://copycast"          # s3://<bucket>[/<prefix>]
endpoint          = "http://localhost:8333"  # empty for AWS S3; the SeaweedFS of `make db-up`
access_key_id     = "copycast"               # prefer COPYCAST__STORAGE__* in the environment
secret_access_key = "copycast"
scratch_dir       = "./scratch"              # local: downloads and transcodes, never served

[cache]                      # the shared Feed cache; unset, each api process caches alone
url = "redis://localhost:6379/0"

# [auth]                     # who signs in; neither users nor a password: open (docs/adr/0004)
# default_quota     = "unlimited"  # a User's storage without a quota of their own: "10 GB", "500 MB"
# session_days      = 30           # a session slides: it ends after this many days unused
# owner_of_existing = "florent"    # who gets the Feeds that exist before 3.0 (default: the first
#                                  # admin below); applied once, by the database migration
#
# [[auth.users]]             # users mode: one table per User (usernames: a-z, 0-9, '.', '_', '-')
# username      = "florent"
# password_hash = '$argon2id$v=19$m=65536,t=3,p=4$...'   # copycast users hash-password; never the
#                                                        # password itself, never in .env ($ signs)
# totp_secret   = "..."      # copycast users totp florent; required for an admin on https
# admin         = true
# quota         = "unlimited"
#
# [[auth.users]]
# username      = "emilia"
# password_hash = '$argon2id$v=19$m=65536,t=3,p=4$...'
# quota         = "10 GB"
#
# Legacy single Admin instead of [[auth.users]] (the two are exclusive): set
# COPYCAST__AUTH__PASSWORD (8+ characters) and optionally COPYCAST__AUTH__USERNAME. The file
# holds secrets once it lists users: chmod 0640, owned by root and the container's group.

# [security]                 # the fetch guard (docs/adr/0023): server-side fetches refuse loopback,
#                            # private, link-local, CGNAT and other non-public addresses (and
#                            # redirects to them); list the exceptions here, e.g. a LAN Source
# allow_private_hosts = []   # hostnames (exact; may then resolve anywhere) or CIDRs (a bare address
#                            # is one host), e.g. ["nas.lan", "192.168.1.0/24"];
#                            # or COPYCAST__SECURITY__ALLOW_PRIVATE_HOSTS='["nas.lan"]'

# COPYCAST_FORWARDED_ALLOW_IPS (trusted proxies) is environment-only: written here it is
# ignored, without an error. COPYCAST_ALLOWED_HOSTS (extra host names browsers and clients
# may use) belongs in the environment too, though this file can set it like the other flat
# knobs. See docs/operations.md, "Environment-only variables".
