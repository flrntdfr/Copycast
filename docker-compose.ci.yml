# CI overlay for the e2e job and `make test-e2e`:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile direct up -d --wait
#
# Adds a `fixtures` service (plain http.server over tests/fixtures, reachable from the api and
# worker containers as http://fixtures:8000) and runs the locally built `copycast:ci` image with
# a localhost base URL so feed and media links resolve from the test runner.

services:
  fixtures:
    image: python:3.13.15-slim-bookworm@sha256:2325bb286ec344af3e5898cc224b5844e2707ac6e26b1632516fd3edc84a5e26
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0", "--directory", "/fixtures"]
    volumes:
      - ./tests/fixtures:/fixtures:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 6
    restart: "no"

  api-direct:
    image: copycast:ci
    pull_policy: never
    environment:
      COPYCAST__BASE_URL: http://localhost:8080
      COPYCAST_LOG_LEVEL: DEBUG
    depends_on:
      fixtures:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    image: copycast:ci
    pull_policy: never
    environment:
      COPYCAST__BASE_URL: http://localhost:8080
      COPYCAST_LOG_LEVEL: DEBUG
    depends_on:
      fixtures:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    restart: "no"
